# 数据丢失警示 (状态栏 + 弹层) — 预览丢弃 (rawdata) 与真实丢失 (pipeline) 语义区分
statusDropped: 检测到数据丢失, 点击查看说明
notifDataDroppedTitle: 检测到数据丢失
notifDataDroppedBody: "最近窗口丢失 {{count}} 条消息 (这些字节未进入解析, 波形存在缺口)。可尝试: 降低数据源速率; 在 设置→性能 中调大并行 worker 上限与缓冲; 关闭不需要的原始数据订阅"
droppedInfoTitle: 数据丢失说明
droppedInfoTitleRawdata: 预览丢弃说明
droppedInfoWhatRawdata: 这是什么 — 原始数据预览的容量溢出计数。这些字节已被正常解析并进入波形, 只是预览没有全部保留显示。这不是数据丢失, 解析与波形不受影响。
droppedInfoWhatPipeline: 这是什么 — 真实的数据丢失。接收速度超过解析管道的处理能力时, 部分消息在解析前被跳过 (broadcast Lagged), 波形与解析结果存在缺口。
droppedInfoWhy: "为什么会发生 — 数据源速率过高, 或解析/渲染速度跟不上。管道使用有界缓冲, 缓冲满时多余的消息会被丢弃而不是阻塞数据流。提示: 原始数据预览的丢弃计数 (黄色) 不代表数据丢失。"
droppedInfoHowRawdata: 怎么办 — 降低数据源速率, 或在 设置→数据缓存 中调大原始数据缓冲容量。
droppedInfoHowPipeline: 怎么办 — 降低数据源速率; 在 设置→性能 中调大并行 worker 上限与缓冲容量; 或关闭不需要的原始数据订阅。
droppedInfoOpenSettings: 打开设置
