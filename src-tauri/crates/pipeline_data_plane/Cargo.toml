[package]
name = "pipeline_data_plane"
description = "VOFA-NEXT 数据平面 (字节路由 + 数值平面评估 + 每源数据缓冲 + 解析引擎状态) — 两平面节点图重构核心"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
vofa-next-core = { workspace = true }
vofa-next-buffer = { workspace = true }
vofa-next-nodes = { workspace = true }
vofa-next-dsp = { workspace = true }
vofa-next-protocol = { workspace = true }
vofa-next-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
parking_lot = "0.12"
tauri = { version = "2", features = [] }

# 数据平面读任务调前端事件契约 (events.rs 迁出后从 notify_events 取)
notify_events = { path = "../notify_events" }

[dev-dependencies]
# data_plane/{frame_dispatch, reconcile} 的 #[cfg(test)] 模块用 AppState 构造测试
app_state = { path = "../app_state" }
