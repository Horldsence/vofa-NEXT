[package]
name = "data_plane"
description = "VOFA-NEXT 数据平面 (字节路由 + 数值平面评估 + 每源数据缓冲 + 解析引擎状态) — 两平面节点图重构核心"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
vofa_core = { workspace = true }
can_types = { workspace = true }
logic_types = { workspace = true }
buffer_databuffer = { workspace = true }
buffer_graph = { workspace = true }
buffer_raw = { workspace = true }
engine = { workspace = true }
eval = { workspace = true }
lower = { workspace = true }
scirs2-core = { workspace = true }
rustc-hash = { workspace = true }
kind = { workspace = true }
trigger = { workspace = true }
frame_decoder = { workspace = true }
dsp_filter = { workspace = true }
dsp_fft = { workspace = true }
dsp_window = { workspace = true }
protocol_engine = { workspace = true }
data_bus = { workspace = true }
protocol_float = { workspace = true }
protocol_can_bridge = { workspace = true }
logic_decoder = { workspace = true }
schema_engine = { workspace = true }
schema_types = { workspace = true }
transport_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
parking_lot = "0.12"
tauri = { version = "2", features = [] }

# 数据平面读任务调前端事件契约 (events.rs 迁出后从 notify_events 取)
notify_events = { workspace = true }

[dev-dependencies]
# data_plane/{frame_dispatch, reconcile} 的 #[cfg(test)] 模块用 AppState 构造测试
app_state = { workspace = true }
testkit = { workspace = true }

[[bench]]
name = "eval_bench"
harness = false

[dev-dependencies.criterion]
workspace = true
