[package]
name = "vofa-next"
version = "0.1.2"
description = "Modern serial port assistant with VOFA protocol support"
authors = ["peng"]
edition = "2021"

[lib]
name = "vofa_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [
  "crates/app_state",
  "crates/automotive_can",
  "crates/automotive_diag",
  "crates/automotive_isotp",
  "crates/buffer_databuffer",
  "crates/buffer_graph",
  "crates/buffer_raw",
  "crates/buffer_ring",
  "crates/can_types",
  "crates/cmd_buffer",
  "crates/cmd_can_load",
  "crates/cmd_can_transport",
  "crates/cmd_debug",
  "crates/cmd_graph",
  "crates/cmd_pipeline",
  "crates/cmd_rawdata",
  "crates/core",
  "crates/diagnostic",
  "crates/dsp_filter",
  "crates/dsp_fft",
  "crates/dsp_window",
  "crates/error",
  "crates/logic_decoder",
  "crates/logic_types",
  "crates/menu_shell",
  "crates/notify_events",
  "crates/node_engine",
  "crates/node_frame_decoder",
  "crates/node_kind",
  "crates/node_trigger",
  "crates/pipeline_data_plane",
  "crates/pipeline_dispatcher",
  "crates/pipeline_stream",
  "crates/protocol_can_bridge",
  "crates/protocol_engine",
  "crates/protocol_float",
  "crates/schema_engine",
  "crates/schema_types",
  "crates/subscription",
  "crates/transport_can_bridge",
  "crates/transport_core",
  "crates/transport_net",
  "crates/transport_serial",
  "crates/update_flow",
]

[workspace.package]
edition = "2021"
version = "0.1.2"

[workspace.lints.clippy]
# 最严格 clippy 配置 — 所有规则组 deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# 合理放宽的规则 (风格偏好或无法控制的外部因素)
# 允许模块名与类型名重复 (如 config::Config, transport::Transport)
module_name_repetitions = "allow"
# 不强制每个函数标 must_use (过于激进)
must_use_candidate = "allow"
# 不强制返回 Result/Option 的函数有文档 (本项目非 pub API 库)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 文档中标识符不强制加反引号
doc_markdown = "allow"
# 依赖版本冲突无法控制
multiple_crate_versions = "allow"
# 不要求 package 有完整 metadata (description/license 等)
cargo_common_metadata = "allow"
# 允许较多参数 (如配置初始化)
too_many_arguments = "allow"
# 允许 enum variant 名重复外层名
enum_glob_use = "allow"
# 允许使用 std::print (调试用)
print_stdout = "allow"
print_stderr = "allow"
# 允许大整数/浮点字面量不带下划线 (如波特率 115200)
unreadable_literal = "allow"
# 允许 match 同一变量
single_match_else = "allow"
# 允许 if-then-else 链 (比 match 更清晰时)
match_same_arms = "allow"
# 允许手动 clamp
manual_clamp = "allow"
# 允许结构体字段顺序不优化
struct_field_names = "allow"
# 允许较长的文档
doc_link_code = "allow"
# 允许 &Vec 参数 (与现有 API 兼容)
ptr_arg = "allow"
# 允许返回引用
needless_pass_by_value = "allow"
# 允许使用 format! 字符串
useless_format = "allow"
# 允许默认 trait 实现不显式
new_without_default = "allow"
# 允许较多方法 (impl 块)
too_many_lines = "allow"


[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
log = "0.4"
thiserror = "1"
regex = "1"
glob = "0.3"
rustc-hash = "2"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
buffer_ring = { path = "crates/buffer_ring" }
buffer_databuffer = { path = "crates/buffer_databuffer" }
buffer_graph = { path = "crates/buffer_graph" }
buffer_raw = { path = "crates/buffer_raw" }
cmd_buffer = { path = "crates/cmd_buffer" }
cmd_can_load = { path = "crates/cmd_can_load" }
cmd_can_transport = { path = "crates/cmd_can_transport" }
cmd_debug = { path = "crates/cmd_debug" }
cmd_graph = { path = "crates/cmd_graph" }
cmd_pipeline = { path = "crates/cmd_pipeline" }
cmd_rawdata = { path = "crates/cmd_rawdata" }
vofa_core = { path = "crates/core" }
error = { path = "crates/error" }
can_types = { path = "crates/can_types" }
logic_types = { path = "crates/logic_types" }
diagnostic = { path = "crates/diagnostic" }
schema_types = { path = "crates/schema_types" }
protocol_engine = { path = "crates/protocol_engine" }
protocol_float = { path = "crates/protocol_float" }
protocol_can_bridge = { path = "crates/protocol_can_bridge" }
logic_decoder = { path = "crates/logic_decoder" }
node_engine = { path = "crates/node_engine" }
node_frame_decoder = { path = "crates/node_frame_decoder" }
node_kind = { path = "crates/node_kind" }
node_trigger = { path = "crates/node_trigger" }
schema_engine = { path = "crates/schema_engine" }
transport_can_bridge = { path = "crates/transport_can_bridge" }
transport_core = { path = "crates/transport_core" }
transport_net = { path = "crates/transport_net" }
transport_serial = { path = "crates/transport_serial" }
dsp_window = { path = "crates/dsp_window" }
dsp_filter = { path = "crates/dsp_filter" }
dsp_fft = { path = "crates/dsp_fft" }
automotive_isotp = { path = "crates/automotive_isotp" }
automotive_diag = { path = "crates/automotive_diag" }
automotive_can = { path = "crates/automotive_can" }
pipeline_data_plane = { path = "crates/pipeline_data_plane" }
pipeline_dispatcher = { path = "crates/pipeline_dispatcher" }
pipeline_stream = { path = "crates/pipeline_stream" }
notify_events = { path = "crates/notify_events" }
app_state = { path = "crates/app_state" }
menu_shell = { path = "crates/menu_shell" }
update_flow = { path = "crates/update_flow" }
subscription = { path = "crates/subscription" }
libautomotive = "0.1"

[build-dependencies]
