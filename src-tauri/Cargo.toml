pipeline_dispatcher = { workspace = true }
pipeline_stream = { workspace = true }
notify_events = { workspace = true }
app_state = { workspace = true }
subscription = { workspace = true }
menu_shell = { workspace = true }
update_flow = { workspace = true }
cmd_buffer = { workspace = true }
cmd_can_load = { workspace = true }
cmd_can_transport = { workspace = true }
cmd_debug = { workspace = true }
cmd_graph = { workspace = true }
cmd_pipeline = { workspace = true }
cmd_rawdata = { workspace = true }
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
