[package]
name = "vofa-next"
version = "0.1.2"
description = "Modern serial port assistant with VOFA protocol support"
authors = ["peng"]
edition = "2021"

[lib]
name = "vofa_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
debug = true

[workspace]
# 分层规则见 docs/architecture/crate-layers.md：
# 依赖只允许 rank(被依赖方) ≤ rank(依赖方)，同层可互依；
# foundation(0) < protocol/transport/node(1) < pipeline(2) < app/ai(3) < cmd(4) < 二进制(5)
members = [
  # L0 foundation — 错误/类型/缓冲/DSP 原语/自包含基础设施，禁止依赖任何上层
  "crates/foundation/error",
  "crates/foundation/can_types",
  "crates/foundation/vofa_core",
  "crates/foundation/logic_types",
  "crates/foundation/diagnostic",
  "crates/foundation/schema_types",
  "crates/foundation/buffer_ring",
  "crates/foundation/buffer_raw",
  "crates/foundation/buffer_graph",
  "crates/foundation/buffer_databuffer",
  "crates/foundation/dsp_window",
  "crates/foundation/dsp_filter",
  "crates/foundation/dsp_fft",
  "crates/foundation/dsp_measure",
  "crates/foundation/subscription",
  "crates/foundation/gpu_core",
  "crates/foundation/notify_events",
  # L1 protocol — 协议解析/编码引擎
  "crates/protocol/protocol_engine",
  "crates/protocol/protocol_float",
  "crates/protocol/protocol_can_bridge",
  "crates/protocol/logic_decoder",
  "crates/protocol/schema_engine",
  # L1 transport — 通道收发（串口/网络/CAN 桥接/汽车诊断）
  "crates/transport/serial",
  "crates/transport/net",
  "crates/transport/can_bridge",
  "crates/transport/transport_core",
  "crates/transport/automotive_can",
  "crates/transport/automotive_isotp",
  "crates/transport/automotive_diag",
  # L1 node — 节点图编译器与运行时（HIR→Plane→Lower→Eval）
  "crates/node/kind",
  "crates/node/hir",
  "crates/node/plane",
  "crates/node/lower",
  "crates/node/eval",
  "crates/node/engine",
  "crates/node/frame_decoder",
  "crates/node/trigger",
  "crates/node/testkit",
  # L2 pipeline — 数据平面（字节路由/数值求值/流框架/调度）
  "crates/pipeline/data_bus",
  "crates/pipeline/data_plane",
  "crates/pipeline/stream",
  "crates/pipeline/dispatcher",
  # L3 app — 应用核心（全局状态/图提交核心/原生菜单/更新流）
  "crates/app/app_state",
  "crates/app/graph_ops",
  "crates/app/menu_shell",
  "crates/app/update_flow",
  # L3 ai — AI/MCP 基础设施
  "crates/ai/provider",
  "crates/ai/session",
  "crates/ai/chat",
  "crates/ai/mcp_client",
  "crates/ai/mcp_server",
  # L4 cmd — Tauri IPC 命令薄适配层，不承载核心逻辑；禁止被任何非 cmd crate 依赖
  "crates/cmd/ai",
  "crates/cmd/buffer",
  "crates/cmd/can_load",
  "crates/cmd/can_transport",
  "crates/cmd/debug",
  "crates/cmd/display",
  "crates/cmd/graph",
  "crates/cmd/pipeline",
  "crates/cmd/rawdata",
]

[workspace.package]
edition = "2021"
version = "0.1.2"

[workspace.lints.clippy]
# 最严格 clippy 配置 — 所有规则组 deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# 合理放宽的规则 (风格偏好或无法控制的外部因素)
# 允许模块名与类型名重复 (如 config::Config, transport::Transport)
module_name_repetitions = "allow"
# 不强制每个函数标 must_use (过于激进)
must_use_candidate = "allow"
# 不强制返回 Result/Option 的函数有文档 (本项目非 pub API 库)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 文档中标识符不强制加反引号
doc_markdown = "allow"
# 依赖版本冲突无法控制
multiple_crate_versions = "allow"
# 不要求 package 有完整 metadata (description/license 等)
cargo_common_metadata = "allow"
# 允许较多参数 (如配置初始化)
too_many_arguments = "allow"
# 允许 enum variant 名重复外层名
enum_glob_use = "allow"
# 允许使用 std::print (调试用)
print_stdout = "allow"
print_stderr = "allow"
# 允许大整数/浮点字面量不带下划线 (如波特率 115200)
unreadable_literal = "allow"
# 允许 match 同一变量
single_match_else = "allow"
# 允许 if-then-else 链 (比 match 更清晰时)
match_same_arms = "allow"
# 允许手动 clamp

manual_clamp = "allow"
# 允许结构体字段顺序不优化
struct_field_names = "allow"
# 允许较长的文档
doc_link_code = "allow"
# 允许 &Vec 参数 (与现有 API 兼容)
ptr_arg = "allow"
# 允许返回引用
needless_pass_by_value = "allow"
# 允许使用 format! 字符串
useless_format = "allow"
# 允许默认 trait 实现不显式
new_without_default = "allow"
# 允许较多方法 (impl 块)
too_many_lines = "allow"
# MutexGuard 临界区按锁序整段持有是数据平面的刻意并发语义, 按逐次使用拆小作用域
# 反而扩大竞态窗口 (clippy nursery 启发式)
significant_drop_tightening = "allow"
# Tauri 命令保持 async 以在 tokio 运行时执行 (sync 命令会跑在主线程, 持锁路径
# 会阻塞 UI); 大量命令无 await 点属正常形态
unused_async = "allow"



[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# genai: 多 LLM provider 聚合客户端 (OpenAI/Anthropic/Gemini/DeepSeek/通义/Kimi/GLM/
# Ollama 等 26+ 原生协议), 内部复用 reqwest+rustls, 流式与工具调用完备 —
# 避免 AI 对话层手写各家 provider 协议 (AI 功能统一规划在后端的基础设施)
genai = "0.6"
# rmcp: Model Context Protocol 官方 Rust SDK — MCP client (stdio/streamable-http)
# 与 server (streamable-http) 双向能力, MCP 协议不在本仓库自研
rmcp = { version = "3.1", default-features = false, features = [
  "macros",
  "server",
  "transport-streamable-http-server",
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# axum: 本地 MCP server 的 HTTP 宿主 (rmcp streamable-http server 传输为 tower service,
# 需要 HTTP 框架挂载), 仅监听 127.0.0.1
# keyring: 系统凭据库 (macOS Keychain / Windows Credential Manager / libsecret) —
# AI provider 的 API key 存钥匙串而非明文 settings.json; 自研加密落盘仍可被提取,
# 系统凭据库才是正确方案
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
security-framework = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3"
async-trait = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
log = "0.4"
thiserror = "1"
regex = "1"
glob = "0.3"
rustc-hash = "2"
criterion = { version = "0.7", features = ["html_reports"] }
parking_lot = "0.12"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
# wgpu: 跨平台 GPU compute (macOS=Metal / Windows=DX12+Vulkan / Linux=Vulkan) —
# 波形包络降采样 (gpu_core); pollster 供阻塞线程上同步初始化/映射
wgpu = "30"
pollster = "1"
# scirs2-core: SciRS2 科学计算核心 — 数值平面 Math 单元的 SIMD 批量求值
# (SimdUnifiedOps, wide 后端, AVX2/NEON 运行时分发); std 必须显式开启
# (0.6.5 打包缺陷: 关闭 default 后大量模块未按 no_std 门控)
scirs2-core = { version = "0.6.5", default-features = false, features = ["std", "simd"] }
# ---- workspace 内部 crate (按层分组, 路径 = crates/<层>/<crate>) ----
# L0 foundation
gpu_core = { path = "crates/foundation/gpu_core" }
buffer_ring = { path = "crates/foundation/buffer_ring" }
buffer_databuffer = { path = "crates/foundation/buffer_databuffer" }
buffer_graph = { path = "crates/foundation/buffer_graph" }
buffer_raw = { path = "crates/foundation/buffer_raw" }
vofa_core = { path = "crates/foundation/vofa_core" }
error = { path = "crates/foundation/error" }
can_types = { path = "crates/foundation/can_types" }
logic_types = { path = "crates/foundation/logic_types" }
diagnostic = { path = "crates/foundation/diagnostic" }
schema_types = { path = "crates/foundation/schema_types" }
notify_events = { path = "crates/foundation/notify_events" }
subscription = { path = "crates/foundation/subscription" }
dsp_window = { path = "crates/foundation/dsp_window" }
dsp_filter = { path = "crates/foundation/dsp_filter" }
dsp_fft = { path = "crates/foundation/dsp_fft" }
dsp_measure = { path = "crates/foundation/dsp_measure" }
# L1 protocol
protocol_engine = { path = "crates/protocol/protocol_engine" }
protocol_float = { path = "crates/protocol/protocol_float" }
protocol_can_bridge = { path = "crates/protocol/protocol_can_bridge" }
logic_decoder = { path = "crates/protocol/logic_decoder" }
schema_engine = { path = "crates/protocol/schema_engine" }
# L1 transport
can_bridge = { path = "crates/transport/can_bridge" }
transport_core = { path = "crates/transport/transport_core" }
net = { path = "crates/transport/net" }
serial = { path = "crates/transport/serial" }
automotive_isotp = { path = "crates/transport/automotive_isotp" }
automotive_diag = { path = "crates/transport/automotive_diag" }
automotive_can = { path = "crates/transport/automotive_can" }
# L1 node
engine = { path = "crates/node/engine" }
eval = { path = "crates/node/eval" }
frame_decoder = { path = "crates/node/frame_decoder" }
hir = { path = "crates/node/hir" }
kind = { path = "crates/node/kind" }
lower = { path = "crates/node/lower" }
plane = { path = "crates/node/plane" }
testkit = { path = "crates/node/testkit" }
trigger = { path = "crates/node/trigger" }
# L2 pipeline
data_plane = { path = "crates/pipeline/data_plane" }
data_bus = { path = "crates/pipeline/data_bus" }
dispatcher = { path = "crates/pipeline/dispatcher" }
stream = { path = "crates/pipeline/stream" }
# L3 app
app_state = { path = "crates/app/app_state" }
graph_ops = { path = "crates/app/graph_ops" }
menu_shell = { path = "crates/app/menu_shell" }
update_flow = { path = "crates/app/update_flow" }
# L3 ai
provider = { path = "crates/ai/provider" }
chat = { path = "crates/ai/chat" }
session = { path = "crates/ai/session" }
mcp_client = { path = "crates/ai/mcp_client" }
mcp_server = { path = "crates/ai/mcp_server" }
# L4 cmd
ai = { path = "crates/cmd/ai" }
buffer = { path = "crates/cmd/buffer" }
can_load = { path = "crates/cmd/can_load" }
can_transport = { path = "crates/cmd/can_transport" }
debug = { path = "crates/cmd/debug" }
display = { path = "crates/cmd/display" }
graph = { path = "crates/cmd/graph" }
pipeline = { path = "crates/cmd/pipeline" }
rawdata = { path = "crates/cmd/rawdata" }
libautomotive = "0.1"

