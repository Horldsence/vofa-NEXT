name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 现存 1459 条 lint + 17 条 typecheck 违规作为基线展示,先不挡合入。
      # 等基线归零(后续 PR 增量收)后,把 continue-on-error 摘掉,让 CI 真正成为门禁。
      - name: Lint (informational, baseline)
        continue-on-error: true
        run: pnpm lint

      - name: Type check (informational, baseline)
        continue-on-error: true
        run: pnpm typecheck

  crate-layers:
    name: Crate layering
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust toolchain (cargo metadata only)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check crate layering rules
        run: pnpm check:layers

  rust:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri / wry 在 Linux 上编译需要 webkit2gtk 等系统库
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libssl-dev

      - name: Check source file size limit (≤500 lines)
        run: |
          OVER=$(find crates src -name '*.rs' ! -path '*/tests/*' ! -path '*/benches/*' ! -name '*_tests.rs' -exec wc -l {} + | awk '$1 > 500 && $2 != "total" {print}')
          if [ -n "$OVER" ]; then
            echo "::error::Source files exceed the 500-line limit (tests are exempt):"
            echo "$OVER"
            exit 1
          fi
          echo "All source files within 500 lines."

      - name: Rust format
        run: cargo fmt --check

      - name: Clippy (workspace lints 已 deny all/pedantic/nursery/cargo)
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace
