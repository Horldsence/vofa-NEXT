<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOFA-Next</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        background: transparent;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 32px;
        width: 100%;
        height: 100%;
        padding: 0 44px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(160deg, #14161c 0%, #0b0c10 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        color: #e6e8ee;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }
      .logo {
        width: 112px;
        height: 112px;
        flex-shrink: 0;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      }
      .info {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .name {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .subtitle {
        font-size: 12px;
        color: #8a8f9e;
        letter-spacing: 0.2em;
      }
      .progress {
        height: 3px;
        margin-top: 14px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #4f8cff;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .status {
        font-size: 12px;
        color: #8a8f9e;
      }
      .status::after {
        content: '…';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: dots 1.5s steps(4) infinite;
        overflow: hidden;
        vertical-align: bottom;
      }
      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icon.png" alt="VOFA-Next" />
      <div class="info">
        <div class="name">VOFA-Next</div>
        <div class="subtitle">串口助手</div>
        <div class="progress"></div>
        <div class="status">正在初始化</div>
      </div>
    </div>
  </body>
</html>
